name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pg_textsearch_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Configure PostgreSQL
        run: |
          echo "shared_preload_libraries = 'pg_textsearch'" | sudo tee -a /etc/postgresql/18/main/postgresql.conf
          sudo systemctl restart postgresql@18-main

      - name: Install pg_textsearch extension
        run: |
          sleep 3
          psql -h localhost -U postgres -c "CREATE EXTENSION pg_textsearch;" pg_textsearch_test

      - name: Run tests
        run: bundle exec rake test
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: pg_textsearch_test

      - name: Run integration tests
        run: bundle exec rake test:integration
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: pg_textsearch_test

      - name: Run sample scripts
        run: |
          for sample in samples/*.rb; do
            echo "Running $sample..."
            ruby "$sample"
          done
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: pg_textsearch_test

      - name: RuboCop
        run: bundle exec rubocop

  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build gem
        run: gem build pg_textsearch.gemspec

      - name: Publish to RubyGems
        run: gem push *.gem --host https://rubygems.org